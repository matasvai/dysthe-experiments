[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dysthe-pinn"
version = "0.1.0"
description = "Cluster-ready PINN framework for Dysthe3D equation (1.27)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.1"]

[project.optional-dependencies]
test = ["pytest>=7"]
report = ["matplotlib>=3.7", "scipy>=1.10"]

[project.scripts]
dysthe-pinn = "dysthe_pinn.cli:main"
field-fno = "field_fno.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
